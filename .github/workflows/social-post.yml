name: social-post
# Posts the pre-written release verdict (docs/drift/post.txt) to Bluesky and Mastodon,
# automatically, once per new Claude Code version verdict. No secrets set = silent skip, so this
# is safe to ship dormant and arms itself the moment the secrets exist:
#   BLUESKY_IDENTIFIER  e.g. yourhandle.bsky.social
#   BLUESKY_APP_PASSWORD  Settings → App passwords (never the account password)
#   MASTODON_INSTANCE   e.g. https://fosstodon.org
#   MASTODON_TOKEN      Preferences → Development → New application → write:statuses
# X is deliberately absent: its API has been pay-per-use since Feb 2026 (no free posting tier),
# so X posts stay manual, pasted from the privately generated per-platform copy.
# State (the last version posted) lives on the eval-results branch, so re-runs never double-post.
on:
  schedule:
    - cron: '43 */6 * * *'
  workflow_dispatch: {}
permissions: { contents: write }
concurrency: { group: social-post, cancel-in-progress: false }
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          new=$(node -e 'const v=require("./docs/drift/verdicts.json"); console.log(v.verdicts[0]?.claudeCode ?? "")' 2>/dev/null || echo "")
          [ -n "$new" ] || { echo "post=false" >> "$GITHUB_OUTPUT"; echo "no verdicts yet"; exit 0; }
          last=$(git fetch -q origin eval-results && git show origin/eval-results:social/last-posted.json 2>/dev/null | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(JSON.parse(s).claudeCode??"")}catch{console.log("")}})' || echo "")
          if [ "$new" = "$last" ]; then echo "post=false" >> "$GITHUB_OUTPUT"; echo "cc$new already posted"; else echo "post=true" >> "$GITHUB_OUTPUT"; echo "version=$new" >> "$GITHUB_OUTPUT"; fi
      - if: steps.decide.outputs.post == 'true'
        env:
          BSKY_ID: ${{ secrets.BLUESKY_IDENTIFIER }}
          BSKY_PW: ${{ secrets.BLUESKY_APP_PASSWORD }}
          MASTO_INSTANCE: ${{ secrets.MASTODON_INSTANCE }}
          MASTO_TOKEN: ${{ secrets.MASTODON_TOKEN }}
        run: |
          set -euo pipefail
          node config-drift-checker/tools/drift-digest.mjs docs/drift --post "$RUNNER_TEMP/post.txt" >/dev/null 2>&1
          text=$(cat "$RUNNER_TEMP/post.txt")
          posted=false
          if [ -n "$BSKY_ID" ] && [ -n "$BSKY_PW" ]; then
            short=$(printf '%s' "$text" | head -c 290)
            session=$(curl -sf https://bsky.social/xrpc/com.atproto.server.createSession -H 'Content-Type: application/json' -d "$(node -e 'console.log(JSON.stringify({identifier:process.env.BSKY_ID,password:process.env.BSKY_PW}))')")
            jwt=$(printf '%s' "$session" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).accessJwt))')
            did=$(printf '%s' "$session" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).did))')
            SHORT="$short" DID="$did" node -e 'console.log(JSON.stringify({repo:process.env.DID,collection:"app.bsky.feed.post",record:{$type:"app.bsky.feed.post",text:process.env.SHORT,createdAt:new Date().toISOString()}}))' \
              | curl -sf https://bsky.social/xrpc/com.atproto.repo.createRecord -H "Authorization: Bearer $jwt" -H 'Content-Type: application/json' -d @- >/dev/null \
              && { echo "posted to Bluesky"; posted=true; } || echo "::warning::Bluesky post failed"
          fi
          if [ -n "$MASTO_INSTANCE" ] && [ -n "$MASTO_TOKEN" ]; then
            curl -sf "$MASTO_INSTANCE/api/v1/statuses" -H "Authorization: Bearer $MASTO_TOKEN" --data-urlencode "status=$text" >/dev/null \
              && { echo "posted to Mastodon"; posted=true; } || echo "::warning::Mastodon post failed"
          fi
          [ "$posted" = "true" ] || { echo "no social secrets set — dormant (see the header of this workflow for which to set)"; exit 0; }
      - if: steps.decide.outputs.post == 'true'
        env:
          VERSION: ${{ steps.decide.outputs.version }}
        run: |
          set -euo pipefail
          git fetch -q origin eval-results && git worktree add -q /tmp/evres origin/eval-results
          cd /tmp/evres && mkdir -p social
          printf '{ "claudeCode": "%s", "at": "%s" }\n' "$VERSION" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > social/last-posted.json
          git config user.name github-actions[bot]; git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add social/last-posted.json && git commit -qm "social: posted cc$VERSION [skip ci]"
          for i in 1 2 3; do git push -q origin HEAD:eval-results && break; git pull -q --rebase origin eval-results; sleep 3; done
