name: Bug report
description: Something behaved wrong (a tool, the Action, a report)
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations: { required: true }
  - type: input
    id: version
    attributes:
      label: Version (release tag, and `claude --version`)
    validations: { required: true }
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Job summary lines, the diff table, or an aggregate-result.json snippet. Strip anything private.
