name: Hosted tier waitlist
description: "Managed canaries, fleet dashboard and alerts, run by us: join the waitlist"
title: "[Waitlist] "
labels: [hosted-waitlist]
body:
  - type: markdown
    attributes:
      value: |
        Self-hosting is free forever. The hosted tier runs the canaries, fleet dashboards and
        alerts for you. Joining the waitlist is how we decide to build it; no commitment.
  - type: input
    id: repos
    attributes:
      label: How many repos would you run it on?
    validations: { required: true }
  - type: input
    id: price
    attributes:
      label: What would it be worth to you per repo per month? (honest number, even $0)
  - type: textarea
    id: setup
    attributes:
      label: One line about your Claude Code setup (optional)
