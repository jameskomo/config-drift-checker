name: config-drift-checker
# Two tracks, one key, a hard budget (.cdc.yml at the plugin root).
#   pinned  — on push/PR to the setup: the baseline check, on the model id + Claude Code version .cdc.yml pins.
#   canary  — on the schedule: release-watch looks for a new Claude Code or model; if one shipped, the suite
#             runs on the alias + latest Claude Code. Never more often than canary.min_interval_hours, never
#             past budget.per_month_usd — the Action's gate skips with a notice, not a red check.
on:
  schedule:
    - cron: '17 */6 * * *'
  push:
    branches: [main]
    paths: ['CLAUDE.md', '.claude-plugin/**', '.cdc.yml', 'agent-config/**', '.claude/**', 'evals/**']
  pull_request:
    paths: ['CLAUDE.md', '.claude-plugin/**', '.cdc.yml', 'agent-config/**', '.claude/**', 'evals/**']
  workflow_dispatch:
    inputs:
      track:            { description: 'pinned | canary', default: 'pinned' }
      promote-baseline: { description: 'Overwrite baseline with this run (pinned track)', type: boolean, default: false }
      ablation:         { description: 'with-without | none', default: 'none' }
      force:            { description: 'Skip the budget and interval gates', type: boolean, default: false }

permissions: { contents: write, pull-requests: write }
concurrency: { group: config-drift-checker, cancel-in-progress: false }

jobs:
  watch:
    runs-on: ubuntu-latest
    outputs: { run: '${{ steps.decide.outputs.run }}', track: '${{ steps.decide.outputs.track }}', version: '${{ steps.rw.outputs.version }}' }
    env: { ANTHROPIC_API_KEY: '${{ secrets.ANTHROPIC_API_KEY }}' }   # only for the free /v1/models listing
    steps:
      - uses: actions/checkout@8ade135a41bc03ea155e62e844d188df1ea18608 # v7
      - uses: actions/checkout@8ade135a41bc03ea155e62e844d188df1ea18608 # v7
        with: { repository: jameskomo/config-drift-checker, ref: v0, path: cdc }
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v7
        with: { node-version: '22' }
      - id: rw
        run: |
          git fetch --depth=1 origin eval-results 2>/dev/null && git show origin/eval-results:.release-watch.json > .release-watch.json 2>/dev/null || true
          pin=$(node cdc/config-drift-checker/tools/cdc-config.mjs . get model.pinned)
          node cdc/config-drift-checker/tools/release-watch.mjs --state .release-watch.json --models ${pin:+--pin "$pin"} | tee -a "$GITHUB_OUTPUT"
      - id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          RW_CHANGED: ${{ steps.rw.outputs.changed }}
          RW_REASON: ${{ steps.rw.outputs.reason }}
          RW_PREVIOUS: ${{ steps.rw.outputs.previous }}
          RW_VERSION: ${{ steps.rw.outputs.version }}
          RW_NEW_MODELS: ${{ steps.rw.outputs.new_models }}
          RW_PIN_RETIRED: ${{ steps.rw.outputs.pin_retired }}
          INPUT_TRACK: ${{ inputs.track }}
        run: |
          case "$EVENT_NAME" in
            schedule)
              if [ "$RW_CHANGED" = "true" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; echo "track=canary" >> "$GITHUB_OUTPUT"; echo "Canary: $RW_REASON moved (Claude Code $RW_PREVIOUS → $RW_VERSION; new models: $RW_NEW_MODELS)"
              else echo "run=false" >> "$GITHUB_OUTPUT"; echo "track=canary" >> "$GITHUB_OUTPUT"; echo "Nothing new (Claude Code $RW_VERSION); skipping."; fi ;;
            workflow_dispatch) echo "run=true" >> "$GITHUB_OUTPUT"; echo "track=${INPUT_TRACK:-pinned}" >> "$GITHUB_OUTPUT" ;;
            *) echo "run=true" >> "$GITHUB_OUTPUT"; echo "track=pinned" >> "$GITHUB_OUTPUT" ;;
          esac
          [ "$RW_PIN_RETIRED" = "true" ] && echo "::warning::model.pinned is no longer listed by /v1/models — merge the next bump PR or pin a current id" || true

  eval:
    needs: watch
    if: needs.watch.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # One of the two. An API key bills prepaid API credit; a subscription token (`claude setup-token`,
      # Pro/Max/Team/Enterprise) bills nothing beyond the subscription. If both are set, the API key wins.
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      # Running on the subscription token? Remove ANTHROPIC_API_KEY above and pass the key here instead:
      # it then only lists /v1/models for release-watch and never bills a run.
      # CDC_MODELS_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@8ade135a41bc03ea155e62e844d188df1ea18608 # v7
      - uses: jameskomo/config-drift-checker/action@6f9b3f2c1d4a8e7b0c5d9a3e2f1b4c8d7e6a5b9c # v0
        with:
          plugin-dir: .                      # the repo root is the plugin (.claude-plugin/plugin.json)
          track: ${{ needs.watch.outputs.track }}
          ablation: ${{ inputs.ablation || 'none' }}
          promote-baseline: ${{ inputs.promote-baseline || 'false' }}
          force: ${{ inputs.force || 'false' }}
          slack-webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
