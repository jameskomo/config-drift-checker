name: 'config-drift-checker'
description: 'CI for your Claude Code setup: run plugin evals on every release and PR, diff vs a pinned baseline, canary the latest model, open bump PRs, alert on regression — with a budget cap'
author: 'James Komo'
branding: { icon: 'check-circle', color: 'orange' }

# Every `run:` step reads inputs, step outputs and github context through `env:` and quoted "$VARS" —
# never through `${{ … }}` inside the script — so no value can be substituted into bash as code.

inputs:
  plugin-dir:            { description: 'Path to the plugin (contains .claude-plugin/plugin.json, evals/ and optionally .cdc.yml)', required: true }
  track:                 { description: 'pinned (baseline, deterministic) or canary (alias model, latest Claude Code). Empty = .cdc.yml `track`', default: '' }
  runs:                  { description: 'Runs per case (overrides case default and .cdc.yml)', default: '' }
  model:                 { description: 'Agent model alias or id (overrides the track)', default: '' }
  judge-model:           { description: 'LLM grader model (overrides .cdc.yml judge_model)', default: '' }
  ablation:              { description: 'with-without (baseline proof) or none (cheaper regression runs)', default: 'none' }
  scaffold:              { description: 'Run case.yaml scaffold_script (only for suites you authored)', default: 'true' }
  threshold:             { description: 'Score drop that counts as a regression (overrides .cdc.yml thresholds.score)', default: '' }
  coverage-min:          { description: 'Fail the check when agent-config coverage (rules with an eval case) is under this percent. Empty = report only', default: '' }
  report-base-url:       { description: 'Public base URL of the results-branch Pages history folder (e.g. https://<you>.github.io/<repo>/history). When set, PR-comment case names deep-link into this run''s HTML report', default: '' }
  claude-code-version:   { description: 'Claude Code version to install (overrides the track''s harness pin), or "latest"', default: '' }
  results-branch:        { description: 'Orphan branch that stores baseline.json, canary/, history/, spend.json and the release-watch state', default: 'eval-results' }
  promote-baseline:      { description: 'Overwrite baseline.json with this run (first run, or after an intentional change). Pinned track only', default: 'false' }
  force:                 { description: 'Skip the budget and interval gates (manual dispatch only)', default: 'false' }
  open-prs:              { description: 'Open a bump PR after canary.promote_after green canaries, and a pin PR when the pinned track has no pin', default: 'true' }
  repair:                { description: 'On a red result, let the agent propose a config fix, re-run the failing cases and open a repair PR (spends API credit, budget-capped)', default: 'false' }
  slack-webhook-url:     { description: 'Incoming-webhook URL to notify on regression (pass a secret)', default: '' }
  github-token:          { description: 'Token for pushing results, opening PRs and commenting', default: '${{ github.token }}' }
  pages:                 { description: 'Also write docs/ (dashboard, report, latest.json) to the results branch for GitHub Pages (source: results branch, /docs)', default: 'true' }

outputs:
  regressed:       { description: 'Number of regressed/missing cases', value: '${{ steps.diff.outputs.regressed }}' }
  red:             { description: 'Number of cases that turned the check red (regressions + fail_on efficiency drifts)', value: '${{ steps.diff.outputs.red }}' }
  flagged:         { description: 'Number of cases with efficiency drift (warning or red)', value: '${{ steps.diff.outputs.flagged }}' }
  track:           { description: 'pinned or canary', value: '${{ steps.config.outputs.track }}' }
  skipped:         { description: 'true when the budget or interval gate skipped the run', value: '${{ steps.gate.outputs.skipped }}' }
  skip-reason:     { description: 'budget | interval | (empty)', value: '${{ steps.gate.outputs.skip_reason }}' }
  spent-month:     { description: 'USD spent this month on this suite after this run (from the ledger)', value: '${{ steps.store.outputs.spent_month }}' }
  runner:          { description: 'official or shim', value: '${{ steps.runner.outputs.runner }}' }
  claude-version:  { description: 'Claude Code version that was exercised', value: '${{ steps.install.outputs.version }}' }
  result-path:     { description: 'Path to aggregate-result.json for this run', value: '${{ steps.run.outputs.result }}' }
  pr-kind:         { description: 'bump | pin | repair | none — which PR this run opened', value: '${{ steps.pr.outputs.kind }}' }
  pr-url:          { description: 'URL of the PR opened by this run, if any', value: '${{ steps.pr.outputs.url }}' }

runs:
  using: composite
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
      with: { node-version: '22' }

    - id: config
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        PLUGIN_DIR: ${{ inputs.plugin-dir }}
        TRACK_INPUT: ${{ inputs.track }}
      run: |
        set -euo pipefail
        tools="$ACTION_PATH/../config-drift-checker/tools"; echo "tools=$tools" >> "$GITHUB_OUTPUT"
        node "$tools/cdc-config.mjs" "$PLUGIN_DIR" resolve ${TRACK_INPUT:+"$TRACK_INPUT"} --github-output | tee -a "$GITHUB_OUTPUT"

    - id: coverage
      shell: bash
      env:
        TOOLS: ${{ steps.config.outputs.tools }}
        PLUGIN_DIR: ${{ inputs.plugin-dir }}
        COVERAGE_MIN: ${{ inputs.coverage-min }}
      run: |
        # Which rules in CLAUDE.md / skills / hooks have a case. No agent runs, so it runs even when the gate skips.
        fail_args=(); [ -n "$COVERAGE_MIN" ] && fail_args=(--fail-under "$COVERAGE_MIN")
        cov_ok=true
        node "$TOOLS/config-coverage.mjs" "$PLUGIN_DIR" --json "$RUNNER_TEMP/coverage.json" --md "$RUNNER_TEMP/coverage.md" --badge "$RUNNER_TEMP/coverage.svg" "${fail_args[@]}" >/dev/null || cov_ok=false
        node -e 'const c=require(process.env.RUNNER_TEMP+"/coverage.json"); console.log("pct="+(c.pct===null?"":c.pct)+"\ntotal="+c.total+"\ncovered="+c.covered+"\ncoverage-pct="+(c.pct===null?"":c.pct))' >> "$GITHUB_OUTPUT" 2>/dev/null || true
        if [ -n "$COVERAGE_MIN" ] && [ "$cov_ok" = "false" ]; then
          echo "under_min=true" >> "$GITHUB_OUTPUT"
          echo "::error::agent-config coverage is under the required ${COVERAGE_MIN}% — add cases for the untested rules (covers: ids from config-coverage.mjs --list)"
        else echo "under_min=false" >> "$GITHUB_OUTPUT"; fi
        cat "$RUNNER_TEMP/coverage.md" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

    - id: results
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        BRANCH: ${{ inputs.results-branch }}
      run: |
        set -euo pipefail
        d="$RUNNER_TEMP/results"; mkdir -p "$d/canary" "$d/history"
        if git fetch --depth=1 origin "$BRANCH" 2>/dev/null; then
          for f in baseline.json spend.json canary/streak.json canary/latest.json .release-watch.json .claude-code-version; do
            git show "origin/$BRANCH:$f" > "$d/$f" 2>/dev/null || rm -f "$d/$f"
          done
          # the newest ~12 runs feed eval-diff's per-case noise band (names are UTC-stamped, so they sort)
          for f in $(git ls-tree --name-only "origin/$BRANCH" history/ 2>/dev/null | grep '\.json$' | sort | tail -12 || true); do
            git show "origin/$BRANCH:$f" > "$d/$f" 2>/dev/null || rm -f "$d/$f"
          done
        fi
        [ -s "$d/baseline.json" ] && echo "baseline=true" >> "$GITHUB_OUTPUT" || echo "baseline=false" >> "$GITHUB_OUTPUT"
        echo "dir=$d" >> "$GITHUB_OUTPUT"

    - id: gate
      shell: bash
      env:
        TOOLS: ${{ steps.config.outputs.tools }}
        PLUGIN_DIR: ${{ inputs.plugin-dir }}
        TRACK: ${{ steps.config.outputs.track }}
        RESULTS_DIR: ${{ steps.results.outputs.dir }}
        EVENT_NAME: ${{ github.event_name }}
        FORCE: ${{ inputs.force }}
      run: |
        set -euo pipefail
        force=""; [ "$FORCE" = "true" ] && force="--force"
        node "$TOOLS/cdc-gate.mjs" check --config "$PLUGIN_DIR" --track "$TRACK" \
          --spend "$RESULTS_DIR/spend.json" --streak "$RESULTS_DIR/canary/streak.json" \
          --event "$EVENT_NAME" $force | tee "$RUNNER_TEMP/gate.txt" >> "$GITHUB_OUTPUT"
        if grep -q '^run=false' "$RUNNER_TEMP/gate.txt"; then
          reason=$(grep '^reason=' "$RUNNER_TEMP/gate.txt" | cut -d= -f2); spent=$(grep '^spent_month=' "$RUNNER_TEMP/gate.txt" | cut -d= -f2); cap=$(grep '^cap_month=' "$RUNNER_TEMP/gate.txt" | cut -d= -f2); next=$(grep '^next_allowed=' "$RUNNER_TEMP/gate.txt" | cut -d= -f2)
          echo "skipped=true" >> "$GITHUB_OUTPUT"; echo "skip_reason=$reason" >> "$GITHUB_OUTPUT"
          case "$reason" in
            budget)   msg="■ Skipped: monthly budget reached (\$$spent of \$$cap this month, \`budget.per_month_usd\` in .cdc.yml). Raise the cap, wait for next month, or re-run manually with force=true.";;
            interval) msg="■ Skipped: last scheduled canary was less than \`canary.min_interval_hours\` ago; next allowed $next. Push/PR/manual runs are never throttled.";;
            *)        msg="■ Skipped: $reason";;
          esac
          { echo "## Agent-config eval: skipped"; echo; echo "$msg"; } >> "$GITHUB_STEP_SUMMARY"; echo "::notice::config-drift-checker: $msg"
        else echo "skipped=false" >> "$GITHUB_OUTPUT"; echo "skip_reason=" >> "$GITHUB_OUTPUT"; fi

    - id: install
      if: steps.gate.outputs.skipped != 'true'
      shell: bash
      env:
        VERSION_INPUT: ${{ inputs.claude-code-version }}
        HARNESS: ${{ steps.config.outputs.harness }}
      run: |
        set -euo pipefail
        v="$VERSION_INPUT"; [ -n "$v" ] || v="$HARNESS"; [ -n "$v" ] && [ "$v" != "null" ] || v=latest
        case "$v" in *[!A-Za-z0-9.-]*) echo "::error::claude-code-version '$v' is not a version"; exit 1;; esac
        npm install -g "@anthropic-ai/claude-code@$v" >/dev/null
        echo "version=$(claude --version | awk '{print $1}')" >> "$GITHUB_OUTPUT"
        echo "requested=$v" >> "$GITHUB_OUTPUT"

    - id: runner
      if: steps.gate.outputs.skipped != 'true'
      shell: bash
      run: |
        # Official runner if the early-access gate is open for this account, else the shim.
        d=$(mktemp -d); out=$(cd "$d" && claude plugin eval 2>&1 || true); rm -rf "$d"
        if echo "$out" | grep -q "early access"; then echo "runner=shim" >> "$GITHUB_OUTPUT"; else echo "runner=official" >> "$GITHUB_OUTPUT"; fi

    - id: run
      if: steps.gate.outputs.skipped != 'true'
      shell: bash
      env:
        ANTHROPIC_API_KEY: ${{ env.ANTHROPIC_API_KEY }}
        CLAUDE_CODE_OAUTH_TOKEN: ${{ env.CLAUDE_CODE_OAUTH_TOKEN }}
        TOOLS: ${{ steps.config.outputs.tools }}
        PLUGIN_DIR: ${{ inputs.plugin-dir }}
        TRACK: ${{ steps.config.outputs.track }}
        RUNNER: ${{ steps.runner.outputs.runner }}
        CC_VERSION: ${{ steps.install.outputs.version }}
        MODEL_INPUT: ${{ inputs.model }}
        CONFIG_MODEL: ${{ steps.config.outputs.model }}
        JUDGE_INPUT: ${{ inputs.judge-model }}
        CONFIG_JUDGE: ${{ steps.config.outputs.judge_model }}
        RUNS_INPUT: ${{ inputs.runs }}
        SCAFFOLD: ${{ inputs.scaffold }}
        ABLATION: ${{ inputs.ablation }}
        BUDGET_PER_RUN: ${{ steps.config.outputs.budget_per_run_usd }}
      run: |
        set -euo pipefail
        test -n "${ANTHROPIC_API_KEY:-}${CLAUDE_CODE_OAUTH_TOKEN:-}" || { echo "::error::Neither ANTHROPIC_API_KEY nor CLAUDE_CODE_OAUTH_TOKEN is set (BYOK: agent runs bill to your key or your subscription)"; exit 1; }
        out="$RUNNER_TEMP/eval-out"; mkdir -p "$out"
        model="$MODEL_INPUT"; [ -n "$model" ] || model="$CONFIG_MODEL"
        judge="$JUDGE_INPUT"; [ -n "$judge" ] || judge="$CONFIG_JUDGE"
        runs_args=(); [ -n "$RUNS_INPUT" ] && runs_args=(--runs "$RUNS_INPUT")
        scaffold_args=(); [ "$SCAFFOLD" = "true" ] && scaffold_args=(--scaffold)
        if [ "$RUNNER" = "official" ]; then
          claude plugin eval "$PLUGIN_DIR" --ablation "$ABLATION" --model "$model" --judge-model "$judge" \
            "${runs_args[@]}" "${scaffold_args[@]}" --allow-tools Bash Write Edit --no-publish --json "$out/aggregate-result.json" || true
          # the official runner does not know tracks yet: stamp provenance so diff/store/promote can reason about it
          OUT_DIR="$out" JUDGE="$judge" node -e 'const fs=require("fs");const p=process.env.OUT_DIR+"/aggregate-result.json";if(fs.existsSync(p)){const j=JSON.parse(fs.readFileSync(p,"utf8"));j.track=j.track||process.env.TRACK;j.harness=j.harness||{name:"claude-code",version:process.env.CC_VERSION};j.judge=j.judge||{model:process.env.JUDGE};fs.writeFileSync(p,JSON.stringify(j,null,2));}'
        else
          model_args=(); [ -n "$MODEL_INPUT" ] && model_args=(--model "$MODEL_INPUT")
          node "$TOOLS/eval-shim.mjs" "$PLUGIN_DIR" --ablation "$ABLATION" --track "$TRACK" \
            "${model_args[@]}" --judge-model "$judge" --budget "$BUDGET_PER_RUN" "${runs_args[@]}" "${scaffold_args[@]}" --output-dir "$out" || true
        fi
        test -s "$out/aggregate-result.json" || { echo "::error::eval produced no aggregate-result.json"; exit 1; }
        echo "result=$out/aggregate-result.json" >> "$GITHUB_OUTPUT"
        # the stem the store step reuses for history/<stem>.json and docs/history/<stem>.html (PR-comment deep links)
        echo "stem=$(date -u +%Y%m%dT%H%M%SZ)-cc${CC_VERSION}-${RUNNER}-${TRACK}" >> "$GITHUB_OUTPUT"
        errs=$(OUT_DIR="$out" node -e 'const a=require(process.env.OUT_DIR+"/aggregate-result.json").aggregates||{}; console.log((a.erroredRuns||0)+"/"+(a.totalRuns||0)+" "+(a.partialReason||""))')
        case "$errs" in 0/*) echo "errored=false" >> "$GITHUB_OUTPUT";; *) echo "::error::agent runs errored — $errs. Nothing will be stored as a baseline. Common causes: no prepaid API credit on the key's account (console.anthropic.com → Billing), or a Claude Code startup failure — see the eval-report artifact's stderrTail."; echo "errored=true" >> "$GITHUB_OUTPUT";; esac
        OUT_DIR="$out" node -e 'const a=require(process.env.OUT_DIR+"/aggregate-result.json").aggregates||{}; console.log(a.budget&&a.budget.exceeded ? "budget_hit=true" : "budget_hit=false")' >> "$GITHUB_OUTPUT"

    - id: diff
      if: steps.gate.outputs.skipped != 'true'
      shell: bash
      env:
        TOOLS: ${{ steps.config.outputs.tools }}
        PLUGIN_DIR: ${{ inputs.plugin-dir }}
        RESULTS_DIR: ${{ steps.results.outputs.dir }}
        RESULT: ${{ steps.run.outputs.result }}
        ERRORED: ${{ steps.run.outputs.errored }}
        BASELINE_EXISTS: ${{ steps.results.outputs.baseline }}
        PROMOTE: ${{ inputs.promote-baseline }}
        TRACK: ${{ steps.config.outputs.track }}
        MODEL_IS_PINNED: ${{ steps.config.outputs.model_is_pinned }}
        THRESHOLD_INPUT: ${{ inputs.threshold }}
        REPORT_BASE_URL: ${{ inputs.report-base-url }}
        STEM: ${{ steps.run.outputs.stem }}
        RUNNER: ${{ steps.runner.outputs.runner }}
        CC_VERSION: ${{ steps.install.outputs.version }}
        CC_REQUESTED: ${{ steps.install.outputs.requested }}
      run: |
        set +e
        thr_args=(); [ -n "$THRESHOLD_INPUT" ] && thr_args=(--threshold "$THRESHOLD_INPUT")
        hist_args=(); [ -n "$(ls -A "$RESULTS_DIR/history" 2>/dev/null)" ] && hist_args=(--history "$RESULTS_DIR/history")
        url_args=(); [ -n "$REPORT_BASE_URL" ] && url_args=(--report-url "${REPORT_BASE_URL%/}/$STEM.html")
        if [ "$ERRORED" != "true" ] && [ "$BASELINE_EXISTS" = "true" ] && ! { [ "$PROMOTE" = "true" ] && [ "$TRACK" = "pinned" ]; }; then
          node "$TOOLS/eval-diff.mjs" "$RESULTS_DIR/baseline.json" "$RESULT" --config "$PLUGIN_DIR" "${thr_args[@]}" "${hist_args[@]}" "${url_args[@]}" --md "$RUNNER_TEMP/diff.md" --json "$RUNNER_TEMP/diff.json"
          node -e 'const d=require(process.env.RUNNER_TEMP+"/diff.json"); console.log("regressed="+d.regressed+"\nred="+d.red+"\nflagged="+d.flagged)' >> "$GITHUB_OUTPUT"
        else
          node "$TOOLS/eval-diff.mjs" "$RESULT" "$RESULT" --config "$PLUGIN_DIR" "${url_args[@]}" --md "$RUNNER_TEMP/diff.md" >/dev/null
          if [ "$ERRORED" = "true" ]; then sed -i '1s/.*/## Agent-config eval: ⚠ agent runs errored — nothing stored/' "$RUNNER_TEMP/diff.md"
          elif [ "$TRACK" = "canary" ]; then sed -i '1s/.*/## Agent-config eval: canary ran, but there is no pinned baseline yet — run the pinned track first/' "$RUNNER_TEMP/diff.md"
          else sed -i '1s/.*/## Agent-config eval: baseline recorded (no comparison yet)/' "$RUNNER_TEMP/diff.md"; fi
          printf 'regressed=0\nred=0\nflagged=0\n' >> "$GITHUB_OUTPUT"
        fi
        pinned_note=""; [ "$TRACK" = "pinned" ] && [ "$MODEL_IS_PINNED" != "true" ] && pinned_note=" · ⚠ no \`model.pinned\` in .cdc.yml — the baseline floats on the alias (a pin PR will be opened)"
        { echo "**Track:** $TRACK · **Runner:** $RUNNER · **Claude Code:** $CC_VERSION (requested $CC_REQUESTED)$pinned_note"; echo; cat "$RUNNER_TEMP/diff.md"; echo; cat "$RUNNER_TEMP/coverage.md" 2>/dev/null || true; } >> "$GITHUB_STEP_SUMMARY"
        exit 0

    - id: report
      if: steps.gate.outputs.skipped != 'true'
      shell: bash
      env:
        TOOLS: ${{ steps.config.outputs.tools }}
        RESULT: ${{ steps.run.outputs.result }}
        RESULTS_DIR: ${{ steps.results.outputs.dir }}
        BASELINE_EXISTS: ${{ steps.results.outputs.baseline }}
        PROMOTE: ${{ inputs.promote-baseline }}
        THRESHOLD_INPUT: ${{ inputs.threshold }}
        CONFIG_THRESHOLD: ${{ steps.config.outputs.threshold }}
        BUDGET_HIT: ${{ steps.run.outputs.budget_hit }}
      run: |
        base_args=(); [ "$BASELINE_EXISTS" = "true" ] && [ "$PROMOTE" != "true" ] && base_args=(--baseline "$RESULTS_DIR/baseline.json")
        hist_args=(); [ -n "$(ls -A "$RESULTS_DIR/history" 2>/dev/null)" ] && hist_args=(--history "$RESULTS_DIR/history")
        thr="$THRESHOLD_INPUT"; [ -n "$thr" ] || thr="$CONFIG_THRESHOLD"
        node "$TOOLS/eval-report.mjs" "$RESULT" "${base_args[@]}" "${hist_args[@]}" --threshold "$thr" --out "$RUNNER_TEMP/eval-report.html"
        cp "$RESULT" "$RUNNER_TEMP/aggregate-result.json"
        echo "" >> "$GITHUB_STEP_SUMMARY"; echo "📄 Full report (grader reasons, tool calls, responses): download the **eval-report** artifact of this run." >> "$GITHUB_STEP_SUMMARY"
        [ "$BUDGET_HIT" = "true" ] && echo "■ The per-run budget cap (\`budget.per_run_usd\`) stopped this run early; cases without runs show as ❔." >> "$GITHUB_STEP_SUMMARY"
        echo "" >> "$GITHUB_STEP_SUMMARY"; echo "<sub>Running this on several repos, or want history across Claude Code versions? → <a href=\"https://jameskomo.github.io/config-drift-checker/#hosted\">hosted beta</a> · <a href=\"https://github.com/jameskomo/config-drift-checker\">⭐ repo</a></sub>" >> "$GITHUB_STEP_SUMMARY"

    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      if: steps.gate.outputs.skipped != 'true'
      with:
        name: eval-report
        path: |
          ${{ runner.temp }}/eval-report.html
          ${{ runner.temp }}/aggregate-result.json
        retention-days: 90

    - id: store
      if: steps.gate.outputs.skipped != 'true' && steps.run.outputs.errored != 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        ANTHROPIC_API_KEY: ${{ env.ANTHROPIC_API_KEY }}
        CDC_MODELS_API_KEY: ${{ env.CDC_MODELS_API_KEY }}   # API key for the free /v1/models listing when agent runs use a subscription token
        TOOLS: ${{ steps.config.outputs.tools }}
        TRACK: ${{ steps.config.outputs.track }}
        BRANCH: ${{ inputs.results-branch }}
        RESULT: ${{ steps.run.outputs.result }}
        CC_VERSION: ${{ steps.install.outputs.version }}
        RUNNER: ${{ steps.runner.outputs.runner }}
        BASELINE_EXISTS: ${{ steps.results.outputs.baseline }}
        PROMOTE: ${{ inputs.promote-baseline }}
        RED: ${{ steps.diff.outputs.red }}
        STEM: ${{ steps.run.outputs.stem }}
        PAGES: ${{ inputs.pages }}
        PLUGIN_DIR: ${{ inputs.plugin-dir }}
        REPO: ${{ github.repository }}
        SERVER_URL: ${{ github.server_url }}
        RUN_ID: ${{ github.run_id }}
      run: |
        set -euo pipefail
        wt="$RUNNER_TEMP/results-wt"
        git fetch origin "$BRANCH" 2>/dev/null && git worktree add "$wt" "origin/$BRANCH" || { git worktree add --detach "$wt"; (cd "$wt" && git checkout --orphan "$BRANCH" && git rm -rfq . 2>/dev/null || true); }
        cd "$wt"; mkdir -p history canary
        name="$STEM"; stamp="${STEM%%-cc*}"
        cp "$RESULT" "history/${name}.json"
        if [ "$TRACK" = "pinned" ]; then
          if [ "$BASELINE_EXISTS" != "true" ] || [ "$PROMOTE" = "true" ]; then
            if node "$TOOLS/baseline-check.mjs" "$RESULT" --config "$GITHUB_WORKSPACE/$PLUGIN_DIR"; then
              cp "$RESULT" baseline.json
            else
              echo "::error::this run is not baseline material (too few scored runs per case, or errored runs) — baseline.json was NOT promoted; any existing baseline was kept. Re-run with more runs, or lower baseline.min_runs in .cdc.yml"
            fi
          fi
        else
          cp "$RESULT" canary/latest.json
        fi
        # spend ledger + release-watch state live here so the next run can gate on them
        node "$TOOLS/cdc-gate.mjs" record --spend spend.json --result "$RESULT" --track "$TRACK" --run-url "$SERVER_URL/$REPO/actions/runs/$RUN_ID" >> "$GITHUB_OUTPUT"
        echo "$CC_VERSION" > .claude-code-version
        node "$TOOLS/release-watch.mjs" --state .release-watch.json --update --models >/dev/null || true
        # streak + bump/pin decision (a PR is opened by the next step, from the main checkout)
        node "$TOOLS/canary-promote.mjs" --config "$GITHUB_WORKSPACE/$PLUGIN_DIR" --result "$RESULT" --streak canary/streak.json \
          --regressed "$RED" --diff-md "$RUNNER_TEMP/diff.md" --out "$RUNNER_TEMP/decision/decision.json" | tee -a "$GITHUB_OUTPUT"
        if [ "$PAGES" = "true" ]; then
          mkdir -p docs/history
          cp "$RUNNER_TEMP/eval-report.html" "docs/history/${name}.html"
          cp "$RUNNER_TEMP/eval-report.html" docs/report.html
          cp "$RESULT" docs/latest.json
          cp "$RUNNER_TEMP/coverage.json" coverage.json 2>/dev/null && cp "$RUNNER_TEMP/coverage.svg" docs/coverage.svg && cp coverage.json docs/coverage.json || true
          [ -s baseline.json ] && cp baseline.json docs/baseline.json || true
          [ -s spend.json ] && cp spend.json docs/spend.json || true
          [ -s canary/streak.json ] && cp canary/streak.json docs/streak.json || true
          node "$TOOLS/eval-dashboard.mjs" history --baseline baseline.json --reports docs/history --out docs/index.html --title "$REPO" \
            --spend spend.json --streak canary/streak.json --coverage coverage.json --config "$GITHUB_WORKSPACE/$PLUGIN_DIR" >/dev/null
          touch docs/.nojekyll
          echo "dashboard: docs/index.html (enable GitHub Pages: source = branch $BRANCH, folder /docs)" >> "$GITHUB_STEP_SUMMARY"
        fi
        git -c user.name=config-drift-checker -c user.email=config-drift-checker@users.noreply.github.com add -A
        git -c user.name=config-drift-checker -c user.email=config-drift-checker@users.noreply.github.com commit -qm "eval ${stamp} ${TRACK} cc${CC_VERSION} red=${RED}" || true
        git push -q origin "HEAD:$BRANCH"
        cd "$GITHUB_WORKSPACE" && git worktree remove --force "$wt" || true

    - id: pr
      if: inputs.open-prs == 'true' && steps.store.outputs.kind != '' && steps.store.outputs.kind != 'none'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        TOOLS: ${{ steps.config.outputs.tools }}
        PLUGIN_DIR: ${{ inputs.plugin-dir }}
        KIND: ${{ steps.store.outputs.kind }}
        PR_BRANCH: ${{ steps.store.outputs.branch }}
        PR_TITLE: ${{ steps.store.outputs.title }}
        BODY_FILE: ${{ steps.store.outputs.body_file }}
        PIN_MODEL: ${{ steps.store.outputs.model }}
        PIN_HARNESS: ${{ steps.store.outputs.harness }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      run: |
        set -euo pipefail
        echo "kind=$KIND" >> "$GITHUB_OUTPUT"
        case "$PR_BRANCH" in cdc/*) ;; *) echo "::error::unexpected branch name '$PR_BRANCH'"; exit 1;; esac
        if [ -n "$(gh pr list --head "$PR_BRANCH" --state open --json number --jq '.[0].number' 2>/dev/null)" ]; then
          echo "::notice::a $KIND PR from $PR_BRANCH is already open; not opening another"; echo "url=" >> "$GITHUB_OUTPUT"; exit 0
        fi
        wt="$RUNNER_TEMP/pr-wt"; base=$(git rev-parse --abbrev-ref HEAD); [ "$base" != "HEAD" ] || base="$DEFAULT_BRANCH"
        git worktree add -B "$PR_BRANCH" "$wt" HEAD
        node "$TOOLS/cdc-config.mjs" "$wt/$PLUGIN_DIR" set-pins --model "$PIN_MODEL" --harness "$PIN_HARNESS"
        cd "$wt"
        git -c user.name=config-drift-checker -c user.email=config-drift-checker@users.noreply.github.com add -A
        git -c user.name=config-drift-checker -c user.email=config-drift-checker@users.noreply.github.com commit -qm "$PR_TITLE"
        git push -q --force origin "HEAD:$PR_BRANCH"
        gh label create config-drift-checker --color E36209 --description "Opened by config-drift-checker" --force >/dev/null 2>&1 || true
        url=$(gh pr create --base "$base" --head "$PR_BRANCH" --title "$PR_TITLE" --body-file "$BODY_FILE" --label config-drift-checker 2>/dev/null \
           || gh pr create --base "$base" --head "$PR_BRANCH" --title "$PR_TITLE" --body-file "$BODY_FILE" 2>"$RUNNER_TEMP/pr-err.txt") \
           || { echo "::warning::Pushed branch $PR_BRANCH but could not open the $KIND PR: $(tr '\n' ' ' < "$RUNNER_TEMP/pr-err.txt" | cut -c1-300). Enable 'Allow GitHub Actions to create and approve pull requests' (Settings → Actions → General → Workflow permissions) or pass a PAT as github-token; then open it from the branch."; echo "url=" >> "$GITHUB_OUTPUT"; echo "" >> "$GITHUB_STEP_SUMMARY"; echo "⚠ Could not open the **$KIND** PR from \`$PR_BRANCH\` — see the warning in the log." >> "$GITHUB_STEP_SUMMARY"; cd "$GITHUB_WORKSPACE" && git worktree remove --force "$wt" || true; exit 0; }
        echo "url=$url" >> "$GITHUB_OUTPUT"
        echo "" >> "$GITHUB_STEP_SUMMARY"; echo "🔀 Opened a **$KIND** PR: $url" >> "$GITHUB_STEP_SUMMARY"
        cd "$GITHUB_WORKSPACE" && git worktree remove --force "$wt" || true

    - id: repair
      if: inputs.repair == 'true' && steps.gate.outputs.skipped != 'true' && steps.run.outputs.errored != 'true' && steps.diff.outputs.red != '0'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        ANTHROPIC_API_KEY: ${{ env.ANTHROPIC_API_KEY }}
        CLAUDE_CODE_OAUTH_TOKEN: ${{ env.CLAUDE_CODE_OAUTH_TOKEN }}
        ACTION_PATH: ${{ github.action_path }}
        TOOLS: ${{ steps.config.outputs.tools }}
        PLUGIN_DIR: ${{ inputs.plugin-dir }}
        RESULTS_DIR: ${{ steps.results.outputs.dir }}
        BUDGET_MONTH: ${{ steps.config.outputs.budget_per_month_usd }}
        SPENT_MONTH: ${{ steps.store.outputs.spent_month }}
        RUN_ID: ${{ github.run_id }}
      run: |
        set +e
        plugin="$ACTION_PATH/../config-drift-checker"
        remaining=$(node -e 'console.log(Math.max(0, Math.min(2, Number(process.env.BUDGET_MONTH||0) - Number(process.env.SPENT_MONTH||0))))')
        if [ "$(REM="$remaining" node -e 'console.log(Number(process.env.REM) <= 0.2)')" = "true" ]; then echo "::notice::repair skipped: under \$0.20 of monthly budget left"; exit 0; fi
        branch="cdc/repair-$RUN_ID"; wt="$RUNNER_TEMP/repair-wt"; git worktree add -B "$branch" "$wt" HEAD
        prompt="Use the config-drift-checker:repair skill. Plugin under test: $wt/$PLUGIN_DIR. Failing report: $RUNNER_TEMP/aggregate-result.json. Diff vs baseline: $RUNNER_TEMP/diff.md. Baseline: $RESULTS_DIR/baseline.json. Shim: $TOOLS/eval-shim.mjs. Budget for verification runs: \$$remaining. Write your summary to $RUNNER_TEMP/repair-summary.md."
        (cd "$wt" && claude -p "$prompt" --plugin-dir "$plugin" --permission-mode acceptEdits --max-turns 40 --allowedTools Read Edit Write Bash Glob Grep --output-format json > "$RUNNER_TEMP/repair-out.json" 2> "$RUNNER_TEMP/repair-err.txt")
        cd "$wt"
        if [ -z "$(git status --porcelain -- "$PLUGIN_DIR")" ]; then echo "::notice::repair: the agent made no change"; cd "$GITHUB_WORKSPACE"; git worktree remove --force "$wt"; exit 0; fi
        git -c user.name=config-drift-checker -c user.email=config-drift-checker@users.noreply.github.com add -A -- "$PLUGIN_DIR"
        git -c user.name=config-drift-checker -c user.email=config-drift-checker@users.noreply.github.com commit -qm "Repair: restore drifted behaviour (config-drift-checker)"
        git push -q --force origin "HEAD:$branch"
        body="$RUNNER_TEMP/repair-summary.md"; [ -s "$body" ] || { echo "The agent proposed this change after a red run; see the workflow summary for the diff." > "$body"; }
        { echo; echo "---"; echo "<sub>Opened by [config-drift-checker](https://github.com/jameskomo/config-drift-checker) \`repair\`. Review the re-run evidence above before merging; never auto-merged.</sub>"; } >> "$body"
        url=$(gh pr create --head "$branch" --title "Repair: restore drifted agent behaviour" --body-file "$body" --label config-drift-checker 2>/dev/null || gh pr create --head "$branch" --title "Repair: restore drifted agent behaviour" --body-file "$body" 2>"$RUNNER_TEMP/pr-err.txt") \
          || { echo "::warning::Pushed $branch but could not open the repair PR: $(tr '\n' ' ' < "$RUNNER_TEMP/pr-err.txt" | cut -c1-300). Enable 'Allow GitHub Actions to create and approve pull requests' or pass a PAT as github-token."; url=""; }
        echo "" >> "$GITHUB_STEP_SUMMARY"; [ -n "$url" ] && echo "🩹 Opened a **repair** PR: $url" >> "$GITHUB_STEP_SUMMARY" || echo "🩹 Repair pushed to \`$branch\`; open the PR by hand (see the warning in the log)." >> "$GITHUB_STEP_SUMMARY"
        cd "$GITHUB_WORKSPACE" && git worktree remove --force "$wt" || true

    - id: comment
      if: github.event_name == 'pull_request' && steps.gate.outputs.skipped != 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        COVERAGE_UNDER_MIN: ${{ steps.coverage.outputs.under_min }}
      run: |
        # coverage joins the PR comment only when it is failing the check — it is always in the job summary
        cp "$RUNNER_TEMP/diff.md" "$RUNNER_TEMP/comment.md"
        if [ "$COVERAGE_UNDER_MIN" = "true" ]; then { echo; cat "$RUNNER_TEMP/coverage.md"; } >> "$RUNNER_TEMP/comment.md" 2>/dev/null || true; fi
        gh pr comment "$PR_NUMBER" --body-file "$RUNNER_TEMP/comment.md" || true

    - id: slack
      if: inputs.slack-webhook-url != '' && steps.diff.outputs.red != '0' && steps.diff.outputs.red != ''
      shell: bash
      env:
        WEBHOOK_URL: ${{ inputs.slack-webhook-url }}
        REPO: ${{ github.repository }}
        TRACK: ${{ steps.config.outputs.track }}
        RED: ${{ steps.diff.outputs.red }}
        CC_VERSION: ${{ steps.install.outputs.version }}
        SERVER_URL: ${{ github.server_url }}
        RUN_ID: ${{ github.run_id }}
      run: |
        text="🔴 Agent-config drift in *$REPO* ($TRACK track): $RED case(s) red after Claude Code $CC_VERSION. $SERVER_URL/$REPO/actions/runs/$RUN_ID"
        curl -sS -X POST -H 'Content-type: application/json' --data "$(TEXT="$text" node -e 'console.log(JSON.stringify({text: process.env.TEXT}))')" "$WEBHOOK_URL" >/dev/null || true

    - id: gate-exit
      shell: bash
      env:
        SKIPPED: ${{ steps.gate.outputs.skipped }}
        SKIP_REASON: ${{ steps.gate.outputs.skip_reason }}
        ERRORED: ${{ steps.run.outputs.errored }}
        RED: ${{ steps.diff.outputs.red }}
        COVERAGE_UNDER_MIN: ${{ steps.coverage.outputs.under_min }}
      run: |
        if [ "$COVERAGE_UNDER_MIN" = "true" ]; then echo "::error::agent-config coverage is under the required minimum (input coverage-min) — add cases for the untested rules listed in the job summary"; exit 1; fi
        if [ "$SKIPPED" = "true" ]; then echo "skipped ($SKIP_REASON) — not a failure"; exit 0; fi
        if [ "$ERRORED" = "true" ]; then echo "::error::agent runs errored; see the eval-report artifact (stderrTail per run)"; exit 1; fi
        if [ "$RED" != "0" ]; then echo "::error::$RED case(s) red vs baseline (regressions or fail_on efficiency drift)"; exit 1; fi
